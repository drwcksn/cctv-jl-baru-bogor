<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pantauan CCTV Kota Bogor</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #131c31;
      --surface-hover: #1e293b;
      --border: rgba(148, 163, 184, 0.16);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --live: #22c55e;
      --danger: #ef4444;
      --shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.45);
    }

    [data-theme="light"] {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-hover: #f1f5f9;
      --border: rgba(15, 23, 42, 0.1);
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-soft: rgba(2, 132, 199, 0.1);
      --live: #16a34a;
      --danger: #dc2626;
      --shadow: 0 4px 16px -4px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Layar Kunci PIN */
    .lock-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }

    .lock-screen.hidden {
      display: none;
    }

    .lock-card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem 1.5rem;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .lock-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 0.9rem;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
    }

    .lock-card h2 {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    .lock-card p {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 1.25rem;
    }

    .pin-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .pin-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.45em;
      text-align: center;
      padding: 0.65rem 0.75rem;
      border-radius: 10px;
      transition: border-color 0.15s ease;
    }

    .pin-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .pin-input.shake {
      border-color: var(--danger);
      animation: shake 0.32s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .pin-submit {
      width: 100%;
      justify-content: center;
      background: var(--accent);
      border-color: var(--accent);
      color: #0b1120;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 0.6rem 1rem;
    }

    .pin-submit:hover {
      opacity: 0.92;
      background: var(--accent);
    }

    .pin-error {
      min-height: 1.1rem;
      font-size: 0.78rem;
      color: var(--danger);
      margin-top: 0.5rem;
    }

    /* Kontainer Utama Aplikasi */
    .app-container {
      display: none;
      flex-direction: column;
      min-height: 100vh;
    }

    .app-container.unlocked {
      display: flex;
    }

    /* Header Minimalis */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--live);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.65); }
      70% { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    .brand h1 {
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .clock {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.38rem 0.7rem;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    button:hover {
      background: var(--surface-hover);
      border-color: var(--accent);
    }

    button.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    main {
      width: 100%;
      max-width: 1520px;
      margin: 0 auto;
      padding: 0.9rem 1.25rem 1.5rem;
      flex: 1;
    }

    /* Tab Navigasi Mode Fokus */
    .focus-tabs {
      display: none;
      gap: 0.45rem;
      margin-bottom: 0.85rem;
      overflow-x: auto;
      padding-bottom: 0.2rem;
    }

    .focus-tabs.visible {
      display: flex;
    }

    /* Komposisi Pas 5 Video: Baris 1 (2 kamera), Baris 2 (3 kamera) */
    .cctv-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.9rem;
    }

    .cctv-grid .cctv-card:nth-child(1),
    .cctv-grid .cctv-card:nth-child(2) {
      grid-column: span 3;
    }

    .cctv-grid .cctv-card:nth-child(3),
    .cctv-grid .cctv-card:nth-child(4),
    .cctv-grid .cctv-card:nth-child(5) {
      grid-column: span 2;
    }

    .cctv-grid.focus-mode {
      grid-template-columns: 1fr;
    }

    .cctv-grid.focus-mode .cctv-card {
      grid-column: span 1;
    }

    /* Kartu Kamera Clean */
    .cctv-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .cctv-card.is-hidden {
      display: none;
    }

    .card-header {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex: 1;
      min-width: 0;
    }

    .cam-badge {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 0.18rem 0.45rem;
      border-radius: 6px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.32rem;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .status-dot.playing {
      background: var(--live);
    }

    .status-dot.error {
      background: var(--danger);
    }

    .cam-title-input {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 600;
      padding: 0.16rem 0.35rem;
      border-radius: 6px;
      width: 100%;
      min-width: 0;
    }

    .cam-title-input:hover {
      border-color: var(--border);
    }

    .cam-title-input:focus {
      outline: none;
      background: var(--bg);
      border-color: var(--accent);
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      flex-shrink: 0;
    }

    .card-actions button {
      padding: 0.26rem 0.48rem;
      font-size: 0.75rem;
      border-color: transparent;
      color: var(--text-muted);
    }

    .card-actions button:hover {
      color: var(--text);
      border-color: var(--border);
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #020617;
    }

    .cctv-grid.focus-mode .video-wrapper {
      aspect-ratio: auto;
      height: 76vh;
      min-height: 360px;
      max-height: 840px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #020617;
    }

    .stream-overlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.84);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      color: #e2e8f0;
      font-size: 0.82rem;
      text-align: center;
      padding: 1rem;
      transition: opacity 0.2s ease;
    }

    .stream-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2.5px solid rgba(56, 189, 248, 0.25);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Tablet: 2 kolom dengan kamera ke-5 penuh di bawah */
    @media (max-width: 1024px) {
      .cctv-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .cctv-grid .cctv-card:nth-child(1),
      .cctv-grid .cctv-card:nth-child(2),
      .cctv-grid .cctv-card:nth-child(3),
      .cctv-grid .cctv-card:nth-child(4) {
        grid-column: span 1;
      }
      .cctv-grid .cctv-card:nth-child(5) {
        grid-column: span 2;
      }
    }

    /* Ponsel: 1 kolom vertikal */
    @media (max-width: 640px) {
      header { padding: 0.6rem 0.85rem; }
      main { padding: 0.7rem 0.85rem 1.25rem; }
      .cctv-grid { grid-template-columns: 1fr; }
      .cctv-grid .cctv-card:nth-child(n) { grid-column: span 1; }
      .hide-mobile { display: none; }
    }
  </style>
</head>
<body>

  <!-- Layar Kunci PIN -->
  <div class="lock-screen" id="lockScreen">
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <h2>Pantauan CCTV Kota Bogor</h2>
      <p>Masukkan PIN akses untuk membuka siaran langsung.</p>
      <form class="pin-form" onsubmit="handlePinSubmit(event)">
        <input
          id="pinInput"
          class="pin-input"
          type="password"
          inputmode="numeric"
          pattern="[0-9]*"
          autocomplete="off"
          placeholder="••••"
          aria-label="Masukkan PIN"
          oninput="handlePinTyping(this.value)"
          autofocus
        />
        <button type="submit" class="pin-submit">Buka Pantauan</button>
      </form>
      <div class="pin-error" id="pinError"></div>
    </div>
  </div>

  <!-- Halaman Utama (Tersembunyi hingga PIN benar) -->
  <div class="app-container" id="appContainer">
    <header>
      <div class="brand">
        <span class="live-dot" title="Sistem Aktif"></span>
        <h1>CCTV Kota Bogor</h1>
        <span class="clock" id="clock">--:--:-- WIB</span>
      </div>

      <div class="toolbar">
        <button id="btnGrid" class="active" onclick="setLayout('grid')">Grid 5</button>
        <button id="btnFocus" onclick="setLayout('focus')">Fokus 1</button>
        <button onclick="reloadAll()" title="Segarkan semua kamera">↻ <span class="hide-mobile">Segarkan</span></button>
        <button id="btnTheme" onclick="toggleTheme()" title="Ganti tema">☀</button>
        <button onclick="lockApp()" title="Kunci layar kembali">🔒 <span class="hide-mobile">Kunci</span></button>
      </div>
    </header>

    <main>
      <div class="focus-tabs" id="focusTabs"></div>
      <section class="cctv-grid" id="cctvGrid"></section>
    </main>
  </div>

  <script>
    // UBAH PIN DI BAWAH INI SEBELUM UPLOAD KE GITHUB PAGES
    const ACCESS_PIN = "661414";

    const CAMERAS = [
      {
        id: "cam-1",
        badge: "CAM 1",
        defaultName: "CCTV Bogor 1",
        url: "https://restreamer5.kotabogor.go.id/memfs/a2f66732-01a5-460f-a11b-79b4f7e9c1da.m3u8"
      },
      {
        id: "cam-2",
        badge: "CAM 2",
        defaultName: "CCTV Bogor 2",
        url: "https://restreamer4.kotabogor.go.id/memfs/0316066f-7936-44ce-9acd-d2f9032d44b4.m3u8"
      },
      {
        id: "cam-3",
        badge: "CAM 3",
        defaultName: "CCTV Bogor 3",
        url: "https://restreamer5.kotabogor.go.id/memfs/d220d1d8-ff5f-40ee-a3f8-019deb6bd019.m3u8"
      },
      {
        id: "cam-4",
        badge: "CAM 4",
        defaultName: "CCTV Bogor 4",
        url: "https://restreamer5.kotabogor.go.id/memfs/c18014c9-7e81-4fc4-a799-b71fe2718e08.m3u8"
      },
      {
        id: "cam-5",
        badge: "CAM 5",
        defaultName: "CCTV Bogor 5",
        url: "https://restreamer6.kotabogor.go.id/memfs/676bd3d3-fbd3-48b4-b40c-15bb4105876f.m3u8"
      }
    ];

    const STORAGE_NAMES_KEY = "bogor_cctv_names_by_url_v1";
    const STORAGE_THEME_KEY = "bogor_cctv_theme";
    const SESSION_UNLOCK_KEY = "bogor_cctv_unlocked_v1";

    let customNames = JSON.parse(localStorage.getItem(STORAGE_NAMES_KEY) || "{}");
    let currentLayout = "grid";
    let activeFocusId = CAMERAS[0].id;
    let hlsInstances = {};
    let isInitialized = false;

    /* Logika Kunci PIN */
    function handlePinTyping(value) {
      document.getElementById("pinError").textContent = "";
      if (value.length === ACCESS_PIN.length) {
        verifyPin(value);
      }
    }

    function handlePinSubmit(event) {
      event.preventDefault();
      const input = document.getElementById("pinInput");
      verifyPin(input.value);
    }

    function verifyPin(enteredPin) {
      const input = document.getElementById("pinInput");
      const errorEl = document.getElementById("pinError");

      if (enteredPin === ACCESS_PIN) {
        sessionStorage.setItem(SESSION_UNLOCK_KEY, "true");
        input.value = "";
        errorEl.textContent = "";
        unlockApp();
      } else {
        errorEl.textContent = "PIN salah, silakan coba lagi.";
        input.classList.remove("shake");
        void input.offsetWidth;
        input.classList.add("shake");
        input.value = "";
        input.focus();
      }
    }

    function unlockApp() {
      document.getElementById("lockScreen").classList.add("hidden");
      document.getElementById("appContainer").classList.add("unlocked");

      if (!isInitialized) {
        isInitialized = true;
        renderCameras();
        updateClock();
        setInterval(updateClock, 1000);
      } else {
        reloadAll();
      }
    }

    function lockApp() {
      sessionStorage.removeItem(SESSION_UNLOCK_KEY);

      // Hentikan semua stream agar tidak berjalan di balik layar kunci
      Object.keys(hlsInstances).forEach((id) => {
        if (hlsInstances[id]) {
          hlsInstances[id].destroy();
          delete hlsInstances[id];
        }
      });
      CAMERAS.forEach((cam) => {
        const video = document.getElementById(`video-${cam.id}`);
        if (video) {
          video.pause();
          video.removeAttribute("src");
          video.load();
        }
      });

      document.getElementById("appContainer").classList.remove("unlocked");
      document.getElementById("lockScreen").classList.remove("hidden");
      const input = document.getElementById("pinInput");
      input.value = "";
      input.focus();
    }

    /* Logika Pemutar & UI CCTV */
    function getCamName(cam) {
      return customNames[cam.url] || cam.defaultName;
    }

    function saveCamName(url, value) {
      const trimmed = value.trim();
      if (trimmed) {
        customNames[url] = trimmed;
      } else {
        delete customNames[url];
      }
      localStorage.setItem(STORAGE_NAMES_KEY, JSON.stringify(customNames));
      renderFocusTabs();
    }

    function setStreamStatus(id, state, message = "") {
      const overlay = document.getElementById(`overlay-${id}`);
      const dot = document.getElementById(`dot-${id}`);
      if (!overlay || !dot) return;

      dot.className = "status-dot";

      if (state === "loading") {
        overlay.classList.remove("hidden");
        overlay.innerHTML = `
          <div class="spinner"></div>
          <span>${message || "Menghubungkan..."}</span>
        `;
      } else if (state === "playing") {
        dot.classList.add("playing");
        overlay.classList.add("hidden");
      } else if (state === "paused") {
        overlay.classList.remove("hidden");
        overlay.innerHTML = `
          <span>Autoplay ditahan oleh browser.</span>
          <button onclick="manualPlay('${id}')">▶ Putar</button>
        `;
      } else if (state === "error") {
        dot.classList.add("error");
        overlay.classList.remove("hidden");
        overlay.innerHTML = `
          <span>${message || "Aliran kamera terputus."}</span>
          <button onclick="reloadCamera('${id}')">↻ Hubungkan Ulang</button>
        `;
      }
    }

    function manualPlay(id) {
      const video = document.getElementById(`video-${id}`);
      if (!video) return;
      video.muted = true;
      video.play()
        .then(() => setStreamStatus(id, "playing"))
        .catch(() => {});
    }

    function initPlayer(cam) {
      const video = document.getElementById(`video-${cam.id}`);
      if (!video) return;

      if (hlsInstances[cam.id]) {
        hlsInstances[cam.id].destroy();
        delete hlsInstances[cam.id];
      }

      setStreamStatus(cam.id, "loading", `Memuat ${cam.badge}...`);

      video.muted = true;
      video.autoplay = true;
      video.playsInline = true;

      if (typeof Hls !== "undefined" && Hls.isSupported()) {
        const hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          liveBackBufferLength: 10
        });

        hlsInstances[cam.id] = hls;
        hls.loadSource(cam.url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play()
            .then(() => setStreamStatus(cam.id, "playing"))
            .catch(() => setStreamStatus(cam.id, "paused"));
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              setStreamStatus(cam.id, "loading", "Menyambung ulang...");
              hls.startLoad();
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              hls.recoverMediaError();
            } else {
              hls.destroy();
              setStreamStatus(cam.id, "error", "Stream tidak merespons.");
            }
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = cam.url;
        video.addEventListener("loadedmetadata", () => {
          video.play()
            .then(() => setStreamStatus(cam.id, "playing"))
            .catch(() => setStreamStatus(cam.id, "paused"));
        }, { once: true });

        video.addEventListener("error", () => {
          setStreamStatus(cam.id, "error", "Gagal memuat video.");
        }, { once: true });
      } else {
        setStreamStatus(cam.id, "error", "Browser tidak mendukung HLS (.m3u8).");
      }
    }

    function renderCameras() {
      const grid = document.getElementById("cctvGrid");
      grid.innerHTML = "";

      CAMERAS.forEach((cam) => {
        const card = document.createElement("article");
        card.className = "cctv-card";
        card.id = `card-${cam.id}`;

        card.innerHTML = `
          <div class="card-header">
            <div class="title-group">
              <span class="cam-badge">
                <span class="status-dot" id="dot-${cam.id}"></span>
                ${cam.badge}
              </span>
              <input
                class="cam-title-input"
                type="text"
                value="${getCamName(cam).replace(/"/g, "&quot;")}"
                aria-label="Nama lokasi ${cam.badge}"
                title="Klik untuk mengubah nama lokasi"
                onchange="saveCamName('${cam.url}', this.value)"
              />
            </div>
            <div class="card-actions">
              <button onclick="reloadCamera('${cam.id}')" title="Sinkronkan ulang">↻</button>
              <button onclick="toggleFullscreen('card-${cam.id}')" title="Layar penuh">⛶</button>
            </div>
          </div>
          <div class="video-wrapper">
            <video
              id="video-${cam.id}"
              autoplay
              muted
              playsinline
              controls
            ></video>
            <div class="stream-overlay" id="overlay-${cam.id}">
              <div class="spinner"></div>
              <span>Menghubungkan...</span>
            </div>
          </div>
        `;

        grid.appendChild(card);
        initPlayer(cam);
      });

      renderFocusTabs();
    }

    function renderFocusTabs() {
      const tabContainer = document.getElementById("focusTabs");
      tabContainer.innerHTML = "";

      CAMERAS.forEach((cam) => {
        const btn = document.createElement("button");
        btn.className = cam.id === activeFocusId ? "active" : "";
        btn.textContent = `${cam.badge} · ${getCamName(cam)}`;
        btn.onclick = () => {
          activeFocusId = cam.id;
          applyLayoutVisibility();
          renderFocusTabs();
        };
        tabContainer.appendChild(btn);
      });
    }

    function setLayout(mode) {
      currentLayout = mode;
      document.getElementById("btnGrid").classList.toggle("active", mode === "grid");
      document.getElementById("btnFocus").classList.toggle("active", mode === "focus");
      document.getElementById("cctvGrid").classList.toggle("focus-mode", mode === "focus");
      document.getElementById("focusTabs").classList.toggle("visible", mode === "focus");
      applyLayoutVisibility();
    }

    function applyLayoutVisibility() {
      CAMERAS.forEach((cam) => {
        const card = document.getElementById(`card-${cam.id}`);
        if (!card) return;
        const shouldHide = currentLayout === "focus" && cam.id !== activeFocusId;
        card.classList.toggle("is-hidden", shouldHide);
      });
    }

    function reloadCamera(id) {
      const cam = CAMERAS.find((c) => c.id === id);
      if (cam) initPlayer(cam);
    }

    function reloadAll() {
      CAMERAS.forEach((cam) => initPlayer(cam));
    }

    function toggleFullscreen(elementId) {
      const el = document.getElementById(elementId);
      if (!el) return;
      if (!document.fullscreenElement) {
        el.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
      html.setAttribute("data-theme", next);
      localStorage.setItem(STORAGE_THEME_KEY, next);
      updateThemeButton(next);
    }

    function updateThemeButton(theme) {
      const btn = document.getElementById("btnTheme");
      btn.textContent = theme === "dark" ? "☀" : "☾";
    }

    function updateClock() {
      const now = new Date();
      const formatted = now.toLocaleTimeString("id-ID", {
        timeZone: "Asia/Jakarta",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
      document.getElementById("clock").textContent = `${formatted} WIB`;
    }

    // Inisialisasi Tema & Cek Status Kunci
    const savedTheme = localStorage.getItem(STORAGE_THEME_KEY) || "dark";
    document.documentElement.setAttribute("data-theme", savedTheme);
    updateThemeButton(savedTheme);

    document.getElementById("pinInput").setAttribute("maxlength", ACCESS_PIN.length);
    document.getElementById("pinInput").placeholder = "•".repeat(ACCESS_PIN.length);

    if (sessionStorage.getItem(SESSION_UNLOCK_KEY) === "true") {
      unlockApp();
    }
  </script>
</body>
</html>
